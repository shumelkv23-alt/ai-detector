<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Detective — детектор сгенерированных изображений</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap">
  <script type="module" src="/src/main.js"></script>
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="header">
  <div class="container header-row">
    <a href="#" class="header-logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="currentColor" stroke-width="1" opacity="0.35">
          <path d="M0 0H32M0 8H32M0 16H32M0 24H32M0 32H32" transform="translate(4 4)"/>
          <path d="M0 0V32M8 0V32M16 0V32M24 0V32M32 0V32" transform="translate(4 4)"/>
        </g>
        <rect x="20" y="4" width="8" height="8" fill="currentColor" opacity="0.9"/>
        <rect x="12" y="20" width="8" height="8" fill="currentColor" opacity="0.5"/>
        <circle cx="24" cy="24" r="11" stroke="currentColor" stroke-width="2" fill="none"/>
        <line x1="32" y1="32" x2="38" y2="38" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
      </svg>
      <span class="word">AI<span class="sep">/</span>DETECTIVE</span>
    </a>
  </div>
</header>

<!-- ========== ANALYZE ========== -->
<section id="analyze" class="section analyze-section">
  <div class="container">
    <div class="section-head">
      <div class="section-eyebrow">— ANALYZE</div>
      <h2 class="section-title">Проверить изображение.</h2>
    </div>

    <div class="analyze-tabs">
      <button class="analyze-tab active" data-tab="file">ФАЙЛ</button>
      <button class="analyze-tab" data-tab="url">URL</button>
    </div>

    <div id="file-tab">
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden>
      <label for="file-input" class="dropzone" id="dropzone">
        <svg class="dropzone-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.5" y="0.5" width="47" height="47" stroke="currentColor" stroke-dasharray="5 4"/>
          <path d="M24 13v18M24 31l-7-7M24 31l7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
          <path d="M14 38h20" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
        <div class="dropzone-text">Перетащите изображение сюда</div>
        <div class="dropzone-hint">или <span class="dropzone-link">выберите файл</span></div>
        <div class="dropzone-formats">JPG · PNG · WEBP · до 10 МБ</div>
      </label>
    </div>

    <div id="url-tab" class="url-input-wrap hidden">
      <input type="url" id="url-input" class="url-input" placeholder="https://example.com/image.jpg">
      <button class="btn btn-primary" id="url-submit">Анализировать</button>
    </div>

    <div id="loading" class="analyze-loading hidden">
      <div class="loading-spinner"></div>
      <div class="loading-text">АНАЛИЗИРУЮ · ЗАПУЩЕНО 3 МОДЕЛИ</div>
    </div>

    <div id="error-toast" class="analyze-error hidden"></div>

    <div id="results" class="results hidden">
      <div class="results-ensemble" id="ensemble-card"></div>
      <div class="results-models" id="models-grid"></div>
    </div>
  </div>
</section>

</body>
</html>
